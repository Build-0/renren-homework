<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+HK:wght@500;700;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one-column exercise-book app. Home = subjects in exam order + schedule + school notes.
   Subject page = the teacher's own checklist, one card per item, each with its games. Characters always sit in 田字格; English uses Andika (school print letterforms). */
:root{
  --paper:#EDF4E8; --card:#FFFFFF; --ink:#1D2A38; --soft:#5A6B62; --rule:#D3E3CC;
  --grid:#D9584B; --grid-faint:rgba(217,88,75,.38);
  --sun:#E39A0B; --leaf:#1F8E5A; --berry:#D23A5A; --sky:#2F6FCB; --on-sky:#FFFFFF;
  --scrim:rgba(29,42,56,.55);
  --kai:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --ui:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --print:"Andika","Century Gothic","Comic Sans MS",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15241D; --card:#1E3329; --ink:#F1F0E6; --soft:#A7BCB0; --rule:#2F4B3D;
    --grid:#F08A7E; --grid-faint:rgba(240,138,126,.4);
    --sun:#FFC940; --leaf:#5FD69D; --berry:#FF7A90; --sky:#82B4FF; --on-sky:#0F2240;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15241D; --card:#1E3329; --ink:#F1F0E6; --soft:#A7BCB0; --rule:#2F4B3D;
  --grid:#F08A7E; --grid-faint:rgba(240,138,126,.4);
  --sun:#FFC940; --leaf:#5FD69D; --berry:#FF7A90; --sky:#82B4FF; --on-sky:#0F2240;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
html,body{height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--ui);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#app{max-width:820px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:26px}
.loading{padding:40px 0;text-align:center;color:var(--soft)}

/* 田字格 */
.word{display:inline-flex}
.tz{width:var(--s);height:var(--s);display:grid;place-items:center;font-family:var(--kai);font-weight:700;font-size:calc(var(--s)*.88);line-height:1;color:var(--ink)}
.tz>span{position:relative;z-index:1}
.word.sm{--s:44px}.word.sm .tz,.word.xs .tz{border-width:1.5px}
.word.xs{--s:28px}
.word.brand{--s:clamp(38px,9vw,50px)}
.word.md.n1,.word.md.n2{--s:min(23vw,104px)} .word.md.n3{--s:min(21vw,92px)}
.word.lg.n1{--s:min(52vw,220px)} .word.lg.n2{--s:min(38vw,170px)} .word.lg.n3{--s:min(27vw,140px)}
.word.mm.n1,.word.mm.n2{--s:min(17vw,62px)} .word.mm.n3{--s:min(13vw,48px)}
.word.sn{--s:clamp(40px,11vw,60px)}
.en{font-family:var(--print);font-weight:700;line-height:1.1;color:var(--ink);text-align:center}
.en.sm{font-size:26px;display:inline-block}
.en.md{font-size:clamp(30px,9vw,46px)}
.en.mm{font-size:clamp(22px,6vw,34px)}
.en.lg{font-size:clamp(48px,15vw,96px)}

/* header + common */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--kai);font-weight:700;font-size:clamp(26px,6.5vw,38px);letter-spacing:.04em}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 14px 4px 10px;font-weight:900;font-variant-numeric:tabular-nums;font-size:20px;white-space:nowrap}
.stars .st{color:var(--sun);font-size:24px;line-height:1}
.note{background:var(--card);border:2px dashed var(--berry);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6;color:var(--soft)}
.sound{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:-16px}
.sound .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:15px}
.snd-msg{flex:1;min-width:0;font-size:14px;color:var(--soft);line-height:1.5}
.usage{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:13px;color:var(--soft);line-height:1.4;font-variant-numeric:tabular-nums}
.sound[hidden]{display:none}
/* ===== 底部分頁、首頁科目行、科目頁、家長頁（2026-10-23 重新設計） ===== */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:4px;background:var(--card);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabbar[hidden]{display:none}
#tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:14px;padding:6px 0;font:inherit;font-size:13px;font-weight:700;color:var(--soft)}
#tabbar button i{font-style:normal;font-size:24px;line-height:1}
#tabbar button.on{color:var(--ink);background:color-mix(in srgb,var(--sun) 28%,transparent)}
#tabbar .bd{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--berry);color:#fff;font-size:12px;line-height:18px;text-align:center}
#tabbar .bd[hidden]{display:none}
body.hastabs #app{padding-bottom:92px}
.pvbadge{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:80;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--card);font-size:11px;opacity:.75;pointer-events:none}
.how-panel .starbig{margin-bottom:6px}
.nextbar{margin:6px 0 10px}
.nextbar .nb-top{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin-bottom:6px}
.nextbar .nb-top b{font-size:22px;color:var(--berry)}
.nextbar .meter{height:14px}
.how{margin:8px 0 0;padding-left:22px;font-size:15px;line-height:1.8;color:var(--soft)}
.tiers{margin:2px 0 2px;padding-left:18px;list-style:disc;color:var(--ink)}
.tiers b{color:var(--berry);font-size:17px}
.allgot{margin:6px 0;font-size:20px;font-weight:700}
.stk.nxt{opacity:1;border:2px dashed var(--sun);font-size:26px;color:var(--sun);font-weight:900}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.pgtitle{margin:0;font-family:var(--kai);font-size:30px}
.starbig{display:flex;align-items:baseline;gap:8px;font-size:34px;font-weight:900}
.starbig .st{color:var(--sun);font-size:40px}
.subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.srow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px 2px 8px;box-shadow:0 3px 0 var(--ink)}
.srow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.subjects .srow .word.ic{--s:34px}
.srow .sj-name{font-size:15px;line-height:1.15;white-space:nowrap}
.srow .pill{font-size:11px;padding:1px 7px}
.srow .mini{display:block;width:70%;height:6px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:2px}
.srow .pct{font-size:12px;font-weight:700;color:var(--leaf);line-height:1}
.srow .mini i{display:block;height:100%;background:var(--leaf)}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.scard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-height:92px;padding:8px 2px;background:color-mix(in srgb,var(--sky) 13%,var(--card));border:2px solid var(--sky);border-radius:16px;box-shadow:0 3px 0 var(--sky)}
.scard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sky)}
.scard .ci{font-size:28px;line-height:1}

.btn.tbtn{padding:6px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}

.top-r{display:flex;align-items:center;gap:10px}
.btn.spkbtn{width:44px;height:44px;padding:0;display:inline-grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.newver{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--card);border:none;border-radius:999px;padding:12px 22px;font:inherit;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}

.sec{margin:0 0 10px;font-family:var(--kai);font-size:24px;text-wrap:balance}

/* subjects */

.usage,.snd-msg,.note,.small,.sec,.panel{-webkit-user-select:text;user-select:text}

.grp-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;margin-bottom:14px;padding-bottom:6px;border-bottom:4px solid var(--gc)}
.grp-head .sec{margin:0}
.grp-range{font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.pretag{display:inline-block;padding:0 8px;border:1.5px solid var(--soft);border-radius:999px;font-size:12px;font-weight:700;line-height:1.5;color:var(--soft);vertical-align:1px}
.songwrap{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.songlink{display:inline-block;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);color:#1D2A38;font-size:14px;font-weight:700;text-decoration:none}
.word.ic{--s:34px}
.subj .tz{border-color:var(--c)}

.sb-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}

.newstk{font-family:var(--kai);font-weight:700}

.sj-name{font-family:var(--kai);font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap}

.ver{font-size:12px;color:var(--soft);letter-spacing:.02em;margin-top:1px;font-variant-numeric:tabular-nums}
.sj-prog{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:6px;width:100%}

.meter{height:8px;border-radius:999px;background:var(--rule);overflow:hidden}

/* schedule + notes */
.panel{background:var(--card);border:2px solid var(--rule);border-radius:18px;padding:14px 16px}

.sched li.gone{opacity:.5}
.notes{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:15px;line-height:1.6}
.foot{font-size:13px;color:var(--soft);line-height:1.6}

/* subject page */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:8px 0;margin:-8px 0;background:var(--paper)}   /* 頂欄固定喺上面，捲到邊都見到返回掣 */
.back{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:8px 18px;min-height:44px;font-weight:700;font-size:18px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.g-title{font-family:var(--kai);font-weight:700;font-size:24px;text-align:left;flex:1;min-width:0}
.shead{display:flex;flex-direction:column;gap:8px}
.shead .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scope{font-size:16px;color:var(--soft);line-height:1.7}
.scope b{color:var(--ink)}
.items{display:grid;gap:14px}
.items{gap:18px!important}
.item{background:var(--card);border:2px solid var(--rule);border-radius:18px;padding:18px;display:grid;gap:16px}
.item h3{margin:0;font-family:var(--kai);font-size:25px;line-height:1.35}
.ihead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.shufs{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.shuf{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.shuf:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.shuf.on{background:var(--sun);color:#1D2A38}
.preview.mixed .pv{animation:grow .35s both}
.preview{display:flex;flex-wrap:wrap;gap:14px 12px}
.pv{background:var(--card);border:2px solid var(--rule);padding:6px 12px;position:relative;border-radius:14px}

.pv.on{background:var(--sun);border-color:var(--ink);transform:scale(1.12);box-shadow:0 4px 0 var(--ink);z-index:2}
.pvs.on{background:color-mix(in srgb,var(--sun) 45%,transparent);border-radius:10px}
.pv.due{border-style:dashed;border-color:var(--sun)}
.pv.due::after{content:"↻";position:absolute;top:-9px;right:-7px;color:var(--sun);font-size:17px;font-weight:900;text-shadow:0 0 2px var(--card)}
.reviewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 18px;border:2px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--ink);text-align:left}
.reviewbar b{font-family:var(--kai);font-size:22px}
.reviewbar span{font-size:14px;color:var(--soft)}
.reviewbar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sents{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.pvs{background:none;border:0;padding:6px 0;text-align:left;font-family:var(--kai);font-size:26px;line-height:1.5}
.pvs u{text-decoration-color:var(--grid);text-decoration-thickness:2px;text-underline-offset:4px}
.gpanel{display:grid;gap:14px}.ggroup h4{margin:0 0 8px;font-size:17px}
.games{display:flex;flex-wrap:wrap;gap:12px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 150px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.gbtn .gi{font-size:20px;line-height:1}
.gbtn.learn{background:color-mix(in srgb,var(--sky) 14%,var(--card));border-color:var(--sky);box-shadow:0 3px 0 var(--sky)}
.gbtn.game{background:color-mix(in srgb,var(--sun) 24%,var(--card))}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.gbtn .ok{color:var(--leaf);font-weight:900}
.sgroup{margin-top:12px}.sgroup h3{margin:0 0 6px;font-size:18px;display:flex;align-items:baseline;gap:8px}.sgroup h3 small{font-size:13px;color:var(--soft);font-weight:400}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.sgrid .songwrap{display:block}.sgrid .song{width:100%;border-radius:12px;padding:7px 8px;font-size:16px;gap:6px;text-align:left;justify-content:flex-start}
@media (max-width:360px){.sgrid{grid-template-columns:1fr}}
.songs{display:flex;flex-wrap:wrap;gap:8px}
.song{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:2px dashed var(--soft);border-radius:999px;padding:6px 14px;font-family:var(--kai);font-size:18px}
.song .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;font-size:13px;font-family:var(--ui);font-weight:900}
.song[aria-pressed="true"]{border-style:solid;border-color:var(--leaf)}
.song[aria-pressed="true"] .tick{background:var(--leaf);border-color:var(--leaf);color:var(--card)}

/* games */
.gbody{display:flex;flex-direction:column;gap:16px}
.dots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--leaf)}
.dots i.cur{background:var(--sun);transform:scale(1.25)}
.speak{align-self:center;display:inline-flex;align-items:center;gap:8px;background:var(--sky);color:var(--on-sky);border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:19px;box-shadow:0 4px 0 var(--ink)}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.qcard{background:var(--card);border:2px solid var(--rule);border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qcard:empty{display:none}
.ask{margin:0;font-family:var(--kai);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.35;text-wrap:balance}
.choices{display:grid;gap:12px}
.choices.row{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
@media (min-width:700px){
#app{max-width:1000px}
.word.sm{--s:68px}.en.sm{font-size:40px}
.pv{padding:10px 18px}.preview{gap:22px 18px}
.scard{min-height:150px;gap:6px}.scard b{font-size:22px}.scard small{font-size:15px}.scard .ci{font-size:48px}
.word.md.n1,.word.md.n2{--s:140px}.word.md.n3{--s:120px}
.word.lg.n1{--s:300px}.word.lg.n2{--s:220px}.word.lg.n3{--s:180px}
.word.mm.n1,.word.mm.n2{--s:84px}.word.mm.n3{--s:66px}
.word.sn{--s:76px}
.en.md{font-size:60px}.en.mm{font-size:44px}.en.lg{font-size:120px}
}
@media (min-width:640px){.choices.col{grid-template-columns:repeat(var(--n),minmax(0,1fr))}}
.choice{position:relative;display:flex;justify-content:center;align-items:center;background:var(--card);border:2px solid var(--rule);border-radius:20px;padding:12px 6px;box-shadow:0 4px 0 var(--rule);min-height:110px;min-width:0}
.choice.right{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf);animation:bounce .5s}
.choice.wrong{opacity:.4;animation:shake .4s}
.choice.reveal{background:color-mix(in srgb,var(--leaf) 26%,var(--card));border:4px solid var(--leaf);box-shadow:0 0 0 5px color-mix(in srgb,var(--leaf) 30%,transparent),0 4px 0 var(--leaf);animation:revealGlow .9s ease-in-out 3;opacity:1}   /* 答錯後：正確答案變成粗綠邊＋綠底＋閃爍＋標籤，其他選項變暗 */
.choice.reveal::after{content:"✓ 正確答案";position:absolute;top:-13px;right:14px;background:var(--leaf);color:#fff;font-size:15px;font-weight:700;padding:2px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.choice.dim{opacity:.35}
.choice.wrong{opacity:1;background:color-mix(in srgb,var(--berry) 14%,var(--card));border-color:var(--berry);box-shadow:0 4px 0 var(--berry)}
.choice.wrong::after{content:"✗";position:absolute;top:-12px;right:14px;background:var(--berry);color:#fff;font-size:15px;font-weight:700;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%}
@keyframes revealGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.025);box-shadow:0 0 0 9px color-mix(in srgb,var(--leaf) 35%,transparent),0 4px 0 var(--leaf)}}
.fb{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px dashed var(--leaf);text-align:center;font-weight:700;animation:grow .4s both}
.fb b{display:block;margin-top:4px;font-family:var(--kai);font-size:clamp(18px,5vw,22px)}
.choice.shake{animation:shake .4s}
.pop{position:absolute;right:10px;top:8px;font-size:40px;line-height:1;animation:grow .4s both}

/* visuals */
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pe{font-size:clamp(44px,13vw,64px);line-height:1}
.qcard .pe{font-size:clamp(64px,20vw,110px)}
.pcap{font-family:var(--kai);font-weight:700;font-size:clamp(16px,4.4vw,22px);line-height:1.25;text-wrap:balance}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(34px,10vw,52px);line-height:1}
.grp i{font-style:normal}
.qcard .grp{font-size:clamp(56px,16vw,90px);gap:10px}
.numv{display:flex;flex-direction:column;align-items:center;line-height:1}
.numv b{font-family:var(--print);font-size:clamp(48px,14vw,72px)}
.numv small{font-family:var(--kai);font-size:22px;color:var(--soft);margin-top:4px}
.qcard .numv b{font-size:clamp(80px,24vw,130px)}
.sw{width:clamp(60px,18vw,90px);aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--ink)}
.shp{width:clamp(64px,19vw,96px);height:auto;max-width:100%;fill:var(--sky);stroke:var(--ink);stroke-width:3}
.wet{position:relative;display:inline-block}
.wet .pe{display:block}
.wet.is .pe{filter:saturate(.6) brightness(.85)}
.wet i{position:absolute;font-style:normal;font-size:.42em;font-size:clamp(18px,5vw,26px)}
.wet i:nth-of-type(1){top:-6px;left:-6px}.wet i:nth-of-type(2){top:30%;right:-12px}.wet i:nth-of-type(3){bottom:-4px;left:20%}
.seq{display:flex;gap:10px;align-items:center;justify-content:center;font-family:var(--print);font-weight:700;font-size:clamp(44px,13vw,72px)}
.seq .q{color:var(--grid);border-bottom:4px dashed var(--grid);min-width:1.2em}
.sentence{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;font-family:var(--kai);font-weight:700;font-size:clamp(30px,8.5vw,50px);line-height:1.3}
.blank{min-width:1.8em;min-height:1.4em;border-bottom:4px dashed var(--grid);display:inline-grid;place-items:center;padding:0 .15em}
.blank.filled{border-bottom-color:transparent;animation:grow .4s both}

/* flash cards */
.fc-count{text-align:center;font-variant-numeric:tabular-nums;color:var(--soft);font-weight:700}
.flash{display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--card);border:2px solid var(--rule);border-radius:24px;padding:24px 12px}
.pic{font-size:min(20vw,96px);line-height:1}
.kstars{text-align:center;font-size:26px;color:var(--sun);letter-spacing:.1em}
.kstars .dim{color:var(--rule)}
.nav{display:flex;justify-content:center;gap:18px}
.round{width:66px;height:66px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:32px;font-weight:700;line-height:1;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round.speakr{background:var(--sky);color:var(--on-sky)}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{position:relative;aspect-ratio:4/3;max-width:100%;border:0;background:none;padding:0;perspective:800px}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;border:2px solid var(--ink)}
.face.back{background-color:var(--sky);background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.14) 10px 20px);color:var(--on-sky);font-size:40px}   /* 翻牌背面（以前寫成 .back，誤將導覽返回掣都變成又大又藍） */
.front{transform:rotateY(180deg);background:var(--card)}
.mcard.done .front{border-color:var(--leaf);box-shadow:inset 0 0 0 3px var(--leaf)}
.memo{font-size:min(14vw,64px);line-height:1}

/* chant + pick-all */
.ngrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (min-width:640px){.ngrid{grid-template-columns:repeat(10,minmax(0,1fr))}}
.nb{aspect-ratio:1;max-width:100%;border:2px solid var(--rule);background:var(--card);border-radius:12px;font-family:var(--print);font-weight:700;font-size:clamp(20px,6vw,28px)}
.nb.lit{background:var(--sun);border-color:var(--ink);color:#1D2A38;transform:scale(1.08)}
.nb.seen{border-color:var(--leaf)}
.crow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pgrid .choice{min-height:96px}

/* celebrate */
.btn{border:2px solid var(--ink);background:var(--sun);color:#1D2A38;border-radius:999px;padding:10px 20px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.blue{background:var(--sky);color:var(--on-sky)}
.cele{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;overflow:hidden;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cele-box{position:relative;z-index:1;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:24px 22px;text-align:center;max-width:340px;width:100%;box-shadow:0 6px 0 var(--ink);animation:grow .45s both}
.big-star{font-size:84px;line-height:1;color:var(--sun);animation:spin 1.2s ease-out}
.cele-box h2{font-family:var(--kai);font-size:32px;margin:8px 0 4px}
.cele-box p{margin:0 0 18px;color:var(--soft);font-size:17px}
.cele-box p b{color:var(--sun);font-size:24px}
.cele-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fall{position:absolute;top:-40px;color:var(--sun);animation:fall 2.6s linear infinite;font-style:normal}

@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes grow{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:rotate(-180deg) scale(.2)}100%{transform:rotate(0) scale(1)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fall{display:none}}
</style>

<body>


<div id="app"><p class="loading">載入複習內容中……</p></div>
<nav id="tabbar" hidden aria-label="主選單"><button data-act="tab" data-t="home"><i>🏠</i><span>首頁</span></button><button data-act="tab" data-t="review"><i>🔁</i><span>複習</span><b class="bd" hidden></b></button><button data-act="tab" data-t="stickers"><i>🏆</i><span>貼紙</span></button><button data-act="tab" data-t="parent"><i>👪</i><span>家長</span></button></nav>

<script>
/* ============ 工具 ============ */
const SPK='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const CN=['零','一','二','三'];
const QN=n=>n===2?'兩':CN[n];   // 數字後面跟量詞要讀「兩」：兩條魚、兩個蘋果（單獨數數才讀「二」）
const PRAISE=['好棒喔！','答對了！','太棒了！','好厲害！','真厲害！'];
const GICON={cards:'🃏',hear:'👂',match:'🧩',sent:'✍️',count:'🔢',order:'↕️',chant:'🎵',next:'➡️',sort:'🗂️',color:'🎨',shape:'🔷',pickall:'👆',review:'🔁',letter:'🔤',lmatch:'🔠',picword:'🖼️',wetdry:'💧',quiz:'❓'};   // 遊戲掣前面嘅小圖示
const GAMES={
  cards:['認','字卡'], hear:['聽','聽音選字'], match:['配','翻牌配對'], sent:['句','句子填充'],
  count:['數','數一數'], order:['序','排順序'], chant:['唱','跟著數'], next:['接','下一個是什麼'],
  sort:['類','分類'], color:['色','選顏色'], shape:['形','選形狀'], pickall:['選','全部選出來'], review:['複','今天複習'],
  letter:['A','聽音選字母'], lmatch:['a','大小寫配對'], picword:['圖','看圖選字'],
  wetdry:['濕','乾或濕'], quiz:['答','問答遊戲']
};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const rand=a=>a[Math.random()*a.length|0];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-today())/864e5);
const fmt=s=>{const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日（${'日一二三四五六'[d.getDay()]}）`;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 儲存（只喺呢部機） ============ */
/* 預覽模式（網址加 ?preview=1）：只讀取真實進度嚟顯示，玩嘅嘢只存喺預覽自己嗰份，唔會寫返資料庫，測試／試玩唔會污染真實進度 */
const PREVIEW=/[?&]preview=1/.test(location.search);
const KEY=PREVIEW?'renren-zi-preview':'renren-zi-v1';
const store={stars:0,known:{},done:{},sung:{}};
try{Object.assign(store,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
store.done=store.done||{}; store.sung=store.sung||{}; store.known=store.known||{}; store.usage=store.usage||{};
const USAGE_EPOCH=2;  // 改這個數字 = 全部裝置清空使用時間統計一次（舊版本留低嘅測試時間唔會同步返嚟）
if(store.usageEpoch!==USAGE_EPOCH){store.usage={};store.usageEpoch=USAGE_EPOCH;}
store.sd=store.sd||{d:'',n:0,k:{}};   // 今日星星：d 日期、n 今日已得、k 今日已計過星星嘅題目
const STAR_EPOCH=1;  // 改呢個數字 = 全部裝置星星同貼紙歸零一次（舊版本嘅星星唔會同步返嚟）
if(store.starEpoch!==STAR_EPOCH){store.stars=0;store.sd={d:'',n:0,k:{}};store.starEpoch=STAR_EPOCH;}
store.mem=store.mem||{};
if(!store.memV){   // 舊版只記「答啱次數」，搬過去當「學緊」（唔信任：可能同一日玩出嚟），下次喺另一日答啱就會升級
  for(const k in store.known){if(!store.mem[k]&&store.known[k]>0)store.mem[k]={b:1,d:'',n:store.known[k],t:0};}
  store.memV=1;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}schedulePush();}

/* ============ 同步（Supabase，全家共用一份進度；連唔到就淨用本機） ============ */
const SB_URL='https://nikijysochwdfcqscgby.supabase.co/rest/v1/renren_progress?id=eq.1';
const SB_KEY='sb_publishable_CXS1oAAM1sTtfalOTFMOTA_FSZwA4gU';
const SB_H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const maxMerge=(a,b)=>{const o={...(a||{})};for(const k in (b||{}))o[k]=Math.max(o[k]||0,b[k]||0);return o;};
function mergeInto(r){
  if(!r||typeof r!=='object')return;
  if(r.starEpoch===STAR_EPOCH){   // 舊世代（歸零之前）嘅星星直接忽略
    store.stars=Math.max(store.stars||0,r.stars||0);
    const rs=r.sd||{d:'',n:0,k:{}},ls=store.sd;
    if(rs.d===ls.d)store.sd={d:ls.d,n:Math.max(ls.n||0,rs.n||0),k:{...(ls.k||{}),...(rs.k||{})},capToast:ls.capToast||rs.capToast};
    else if((rs.d||'')>(ls.d||''))store.sd=rs;
  }
  store.known=maxMerge(store.known,r.known);
  const rm=r.mem||{};   // 每個字取最後更新嗰份（答錯降級先唔會被舊資料蓋返）
  for(const k in rm){const a=store.mem[k];if(!a||(rm[k].t||0)>(a.t||0))store.mem[k]=rm[k];}
  store.done=maxMerge(store.done,r.done);
  const s={...(store.sung||{})};for(const k in (r.sung||{}))s[k]=s[k]||r.sung[k];store.sung=s;
  const uu={...(store.usage||{})};
  const ru=r.usageEpoch===USAGE_EPOCH?(r.usage||{}):{};   // 舊世代嘅統計直接忽略
  for(const k in ru){const a=uu[k],b=ru[k];uu[k]=a?{s:Math.min(a.s,b.s),e:Math.max(a.e,b.e),t:Math.max(a.t,b.t)}:b;}
  store.usage=uu;
}
let pushTimer=null,syncing=false;
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(syncNow,1500);}
async function syncNow(){
  if(syncing){schedulePush();return;}
  syncing=true;
  try{
    const r=await fetch(SB_URL+'&select=data',{headers:SB_H});
    if(!r.ok)throw new Error('pull '+r.status);
    const rows=await r.json();
    mergeInto(rows[0]&&rows[0].data);
    try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}
    if(!PREVIEW){
      const w=await fetch(SB_URL,{method:'PATCH',headers:{...SB_H,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({data:store,updated_at:new Date().toISOString()})});
      if(!w.ok)throw new Error('push '+w.status);
    }
    document.querySelectorAll('.starN').forEach(e=>e.textContent=store.stars);
    if(typeof T!=='undefined'&&T&&!SUBJ&&!G&&!LOGVIEW)renderRoot();
  }catch(e){/* 連唔到就算，下次再同步 */}
  syncing=false;
}

/* ============ 使用時間（手動按「開始計時」才計；畫面關掉或離開不計；閒置 5 分鐘自動結束） ============ */
function soundTested(){try{return localStorage.getItem('renren-zi-snd-tested')==='1';}catch(e){return false;}}
const TKEY='renren-zi-timer-on';  // 只存本機，不同步：每部機自己決定要不要計時
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hm(ms){const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
let timerOn=false;try{timerOn=localStorage.getItem(TKEY)==='1';}catch(e){}
const timerLabel=()=>timerOn?'⏹ 結束計時':'▶ 開始計時';
function usageText(){
  const u=store.usage[dayKey()],m=u?Math.floor(u.t/60):0,mt=m<1?'不到 1':m;
  if(!u||!u.t)return timerOn?'⏱ 計時中…':'⏱ 今天沒有統計時間（沒有按開始計時）';
  return timerOn
    ?`⏱ 計時中｜今天已使用 ${mt} 分鐘｜${hm(u.s)} 開始`
    :`⏱ 今天已使用 ${mt} 分鐘｜${hm(u.s)} 開始｜${hm(u.e)} 結束`;
}
function renderUsage(){
  const el=document.getElementById('usage');if(el)el.textContent=usageText();
  const b=document.getElementById('timerBtn');if(b){b.textContent=timerLabel();b.classList.toggle('on',timerOn);}
}
let lastAct=Date.now(),lastTick=Date.now(),lastUsageSave=0;
function setTimer(on){
  const now=Date.now();timerOn=on;lastTick=now;lastAct=now;
  try{localStorage.setItem(TKEY,on?'1':'0');}catch(e){}
  const k=dayKey(),u=store.usage[k]||(store.usage[k]={s:now,e:now,t:0});
  if(!u.t)u.s=now;   // 今天第一次開始
  u.e=now;save();renderUsage();
}
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();},{passive:true,capture:true}));
setInterval(()=>{
  const now=Date.now(),dt=Math.min(now-lastTick,10000);lastTick=now;
  if(!timerOn||document.hidden)return;
  if(now-lastAct>5*60000){setTimer(false);return;}
  const k=dayKey(),u=store.usage[k]||(store.usage[k]={s:now,e:now,t:0});
  u.t+=dt/1000;u.e=now;renderUsage();
  if(now-lastUsageSave>30000){lastUsageSave=now;save();}
},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{lastTick=Date.now();checkUpdate();}});

/* ============ 版本更新提示（每次發佈要同時改 APP_VER 同 version.json） ============ */
const APP_VER='2026-10-25 09:52';   // 發佈時間（香港時間）；頁尾直接顯示，同 version.json 要一樣
let lastChk=0,updSnooze=0;
async function checkUpdate(){
  if(Date.now()<updSnooze)return;
  lastChk=Date.now();
  try{
    const r=await fetch('version.json?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if(!j.v||j.v===APP_VER||document.getElementById('updbar'))return;
    const bar=document.createElement('button');bar.id='updbar';bar.className='newver';bar.setAttribute('role','alert');
    bar.textContent='🔄 有新版本，點此更新';
    bar.onclick=()=>{location.href=location.pathname+'?'+(PREVIEW?'preview=1&':'')+'v='+Date.now();};   // 同 hqms：加時間參數強制重新載入
    document.body.appendChild(bar);
  }catch(e){}
}
setInterval(checkUpdate,60*1000);
addEventListener('pageshow',checkUpdate);
addEventListener('focus',checkUpdate);
// 手機有時唔會觸發 focus／計時器（例如主畫面圖示開住好耐）：每次點螢幕，如果離上次檢查超過 40 秒，就順便檢查一次
document.addEventListener('pointerdown',()=>{if(Date.now()-lastChk>40000)checkUpdate();},{capture:true,passive:true});
/* ============ 記憶（間隔重溫）============
   每個字一筆：{b:階段 0–5, d:最近一次「升級」嗰日, n:答啱次數, t:最後更新時間}
   - 要喺「唔同日子」第一次就答啱，先升一級（同一日玩十次都只算一次）
   - b>=2（至少兩個唔同日子答啱）＝已記住；但隔咗 MEM_INT[b] 日冇再答啱就變返「要重溫」
   - 答錯（每題第一次錯）降一級
   - 各部機同步時，每個字取最後更新（t 較大）嗰份 */
const MEM_INT=[0,1,3,7,14,30];
const MEM_TXT={new:'未學',learn:'學習中',got:'已記住',due:'要複習'};
const mkey=(lang,w)=>lang+':'+w;
function daysSince(d){return d?Math.round((new Date(dayKey()+'T00:00:00')-new Date(d+'T00:00:00'))/864e5):999;}
function memState(lang,w){
  const m=store.mem[mkey(lang,w)];
  if(!m)return 'new';
  if(m.b>=2)return daysSince(m.d)<=MEM_INT[Math.min(m.b,5)]?'got':'due';
  return 'learn';
}
function memRank(lang,w){   // 數字愈細愈應該先溫
  const s=memState(lang,w),m=store.mem[mkey(lang,w)];
  if(s==='due')return -Math.min(daysSince(m.d),999)/1000;
  if(s==='learn')return m.d===dayKey()?1.6:1;
  return s==='new'?1:2;
}
function award0(kw,first,lang){
  if(!kw)return;
  const key=mkey(lang,kw),m=store.mem[key]||{b:0,d:'',n:0,t:0},today=dayKey();
  m.n++;
  if(first&&m.d!==today){m.b=Math.min(5,m.b+1);m.d=today;}
  m.t=Date.now();store.mem[key]=m;
}
function penalize(kw,lang){
  if(!kw)return;
  const key=mkey(lang,kw),m=store.mem[key]||{b:0,d:'',n:0,t:0};
  m.b=Math.max(0,m.b-1);if(m.b===0)m.d='';
  m.w=(m.w||0)+1;m.t=Date.now();store.mem[key]=m;save();
}

/* ============ 聲音 ============ */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
function pickVoice(lang){
  const L=v=>(v.lang||'').toLowerCase().replace('_','-');
  // 同一種語言有幾個聲音時，優先揀「進階／高品質／自然（Neural）」版本（發音同語調明顯好啲）
  const hq=v=>/premium|enhanced|natural|neural|siri|online|進階|優化|高品質/i.test((v.name||'')+' '+(v.voiceURI||''))?1:0;
  const best=list=>list.sort((a,b)=>hq(b)-hq(a))[0];
  if(lang==='cmn')return best(voices.filter(v=>L(v)==='zh-cn'))||best(voices.filter(v=>L(v)==='zh-tw'))||best(voices.filter(v=>L(v).startsWith('zh')&&!/hk|yue/.test(L(v))));
  if(lang==='en')return best(voices.filter(v=>L(v)==='en-gb'))||best(voices.filter(v=>L(v)==='en-us'))||best(voices.filter(v=>L(v).startsWith('en')));
  return best(voices.filter(v=>L(v)==='zh-hk'||/yue/.test(L(v))));
}
let lastU=null,spoke=false,ttsErr='';
let sayTok=0;
const LETTER_SAY={a:'hey',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'queue',r:'are',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zed'};
function say(text,lang,onend){
  if(!('speechSynthesis' in window)){ttsErr='nosupport';if(onend)setTimeout(onend,700);return;}
  const ss=window.speechSynthesis; if(!voices.length)loadVoices();
  const tok=++sayTok;   // 只認最新一次：新嘅朗讀會取代舊嘅
  const go=retry=>{ if(tok!==sayTok)return; try{
    const u=new SpeechSynthesisUtterance(lang==='en'&&/^[A-Za-z]$/.test(text)?LETTER_SAY[text.toLowerCase()]:text);   // 單個大寫字母 iOS 會讀「capital A」，改用字母名拼音直接讀 A B C
    u.lang=lang==='cmn'?'zh-CN':lang==='en'?'en-GB':'zh-HK';
    const v=pickVoice(lang); if(v)u.voice=v;
    u.rate=lang==='en'?.6:.8; u.volume=1;   // 英文慢啲（K1 要聽清楚每個音）；廣東話／國語 .8
    let started=false;
    // 自己記住「呢句讀完未」：唔完全靠引擎嘅 speaking 狀態（引擎有時卡住，一直話自己仲讀緊）；按字數估一個最長時間做後備
    const dur=Math.min(7000,900+String(text).length*(lang==='en'?120:380))+((v&&v.localService===false)?2500:0);
    u.done=false;u.until=Date.now()+dur;
    u.onstart=()=>{started=true;spoke=true;u.until=Date.now()+dur;};
    u.onerror=e=>{u.done=true;if(e.error!=='interrupted'&&e.error!=='canceled')ttsErr=e.error||'error';};
    u.onend=()=>{u.done=true;if(onend)onend();};

  (t.subjects||[]).forEach(s=>s.items.forEach(it=>{
    (it.quiz||[]).forEach(q=>q.o.forEach(o=>{o[0]=rI(o[0]);}));

}

const STK_STEPS=[[10,5],[20,8]];   // [張數, 每張要幾顆星]：前 10 張每張 5 顆，之後 20 張每張 8 顆
const DAILY_MAX=20;
function stickersOwned(){
  let s=store.stars,n=0;
  for(const [cnt,c] of STK_STEPS){const k=Math.min(cnt,Math.floor(s/c));n+=k;s-=k*c;if(k<cnt)return n;}
  return n;
}
function starsToNext(){
  let s=store.stars;
  for(const [cnt,c] of STK_STEPS){const k=Math.min(cnt,Math.floor(s/c));s-=k*c;if(k<cnt)return c-s;}
  return 0;
}
function toast(html,ms=2200){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=html;
  document.body.appendChild(d);setTimeout(()=>d.remove(),ms);
}
function award(kw,first,lang,qid){
  const before=stickersOwned(),L=lang||G.lang,today=dayKey();
  award0(kw,first,L);   // 記憶（間隔重溫）照常記錄，唔受星星上限影響
  if(store.sd.d!==today)store.sd={d:today,n:0,k:{}};
  const key=kw?`w:${L}:${kw}`:`${G.key}:${qid||G.r}`;   // 同一個字（唔論邊個遊戲）／同一個遊戲同一題，一天只計一次
  if(store.sd.k[key])G.dupe=(G.dupe||0)+1;
  else if(store.sd.n>=DAILY_MAX){
    G.capped=true;
    if(!store.sd.capToast){store.sd.capToast=1;setTimeout(()=>toast(`今天的星星拿滿了（${DAILY_MAX} 顆），明天再來！`,2600),500);}
  }else{store.sd.k[key]=1;store.sd.n++;store.stars++;G.earned++;}
  save();
  document.querySelectorAll('.starN').forEach(e=>e.textContent=store.stars);
  const after=stickersOwned();
  if(after>before){const st=STICKERS[after-1];G.newSticker=st;G.stickerNow=st;}   // 之後喺答案讀完先報（announceThen），唔會被下一題打斷
}
function subjProgress(s){
  let total=0,done=0;
  s.items.forEach((it,i)=>{
    (it.games||[]).forEach(g=>{total++;if(store.done[`${T.id}:${s.id}:${i}:${g}`])done++;});
    (it.songs||[]).forEach(x=>{total++;if(store.sung[`${T.id}:${songN(x)}`])done++;});
  });
  return [done,total];
}

const SUBMETA={yue:['字','認中文字・廣東話','var(--berry)'],math:['數','數字・顏色・形狀','var(--sky)'],eng:['A','ABC・英文生詞','var(--leaf)'],gs:['識','社區・家庭・中秋','var(--sun)'],
  cmn:['普','認中文字・普通話','var(--berry)'],rel:['主','歌曲・祈禱文','var(--sky)'],sing:['歌','唱遊歌曲','var(--leaf)']};

function subjCount(s){
  let n=0;
  s.items.forEach(it=>{
    const c=(it.words||[]).length+(it.letters||[]).length+(it.sentences||[]).length+(it.songs||[]).length+(it.quiz||[]).length+(it.sorts||[]).length;
    n+=c||1;   // 只有遊戲、沒有內容清單的項目算 1 項
  });
  return n;
}
function memStats(s){
  let tot=0,got=0,due=0;const seen=new Set();
  s.items.forEach(it=>(it.words||[]).forEach(w=>{
    const k=mkey(s.lang,w);if(seen.has(k))return;seen.add(k);tot++;
    const st=memState(s.lang,w);if(st==='got')got++;else if(st==='due')due++;
  }));
  return {tot,got,due};
}
function metaLine(s){
  const lv=LEVELS[s.level],ms=memStats(s);
  const l1=lv?`難度 ${lv[0]} ${lv[1]}`:'';
  const l2=[s.minutes?`約 ${s.minutes} 分鐘`:'',`${subjCount(s)} 項`].filter(Boolean).join('・');
  const l3=ms.tot?`已記住 ${ms.got}／${ms.tot} 字${ms.due?`・${ms.due} 個要複習`:''}`:'';
  return [l1,l2,l3].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('');   // 難度、時間、記住程度各佔一行
}

/* ============ 貼紙分頁 ============ */
function stickerProg(){   // 距離下一張貼紙嘅進度
  let s=store.stars;
  for(const [cnt,c] of STK_STEPS){const k=Math.min(cnt,Math.floor(s/c));s-=k*c;if(k<cnt)return {done:false,into:s,cost:c,left:c-s};}
  return {done:true,into:0,cost:1,left:0};
}
const stickerLeftLine=()=>{const p=stickerProg();return p.done?'':`<p class="small">離下一張貼紙還差 <b>${p.left}</b> 顆星</p>`;};
const tierLines=()=>{let a=1,tot=0;return STK_STEPS.map(([cnt,c])=>{const b=a+cnt-1;tot+=cnt*c;const t=`<li>第 ${a}–${b} 張：每張 <b>${c}</b> 顆星（累計 ${tot} 顆）</li>`;a=b+1;return t;}).join('');};   // 由 STK_STEPS 自動產生，改規則唔使改字
function stickerBook(){
  const n=stickersOwned(),done=n>=STICKERS.length;
  return `<section class="panel"><div class="sb-head"><h2 class="sec">我的貼紙</h2><span class="small">${n} ／ ${STICKERS.length}</span></div>
    <div class="sbook">${STICKERS.map((st,i)=>i<n?`<span class="stk got" title="${st.n}" aria-label="${st.n}">${st.s}</span>`:`<span class="stk${i===n&&!done?' nxt':''}">${i===n&&!done?'？':''}</span>`).join('')}</div></section>`;
}

const learnItems=s=>s.items.map((it,i)=>({it,i})).filter(({it})=>!(songItemOnly(it)&&!songOnly(s))&&(hasDetail(it)||(it.games||[]).some(isLearn)));
const gameItems=s=>s.items.map((it,i)=>({it,i})).filter(({it})=>(it.games||[]).some(g=>!isLearn(g)));
const segLabel=it=>String(it.label).replace(/內容$/,'');

  if(it.songs)body=`<div class="songs">${it.songs.map(x=>{const n=songN(x),u=typeof x==='object'&&/^https?:\/\//.test(x.url||'')?x.url:'';
    return `<span class="songwrap"><button class="song" data-act="sing" data-n="${esc(n)}" aria-pressed="${!!store.sung[`${T.id}:${n}`]}"><span class="tick">✓</span>《${esc(n)}》</button>${u?`<a class="songlink" href="${esc(u)}" target="_blank" rel="noopener">▶ 聽歌</a>`:''}</span>`;}).join('')}</div><p class="small">複習完一首，按一下記起來。${it.songs.some(x=>typeof x==='object'&&x.url)?'有「▶ 聽歌」的可以按下去聽。':''}</p>`;
  app.innerHTML=`
    <div class="bar"><button class="back" data-act="back">‹ 返回</button><div class="g-title">${esc(s.name)}・${esc(ITEM_NAME(it))}</div></div>

}

/* ============ 遊戲框 ============ */
function renderGame(body){
  tabs(null);
  const back=G.review?'<button class="back" data-act="home">✕ 離開</button>':`<button class="back" data-act="subj">‹ ${esc(SUBJ.name)}</button>`;
  app.innerHTML=`<div class="bar">${back}<div class="g-title">${G.mix?`遊戲 <small>${G.mix.idx+1}／${G.mix.segs.length}</small>`:GAMES[G.g][1]}</div></div><div class="gbody">${body}</div>`;
}
const dots=()=>`<div class="dots" aria-label="第 ${G.r+1} 題，共 ${G.total} 題">${Array.from({length:G.total},(_,i)=>`<i class="${i<G.r?'on':i===G.r?'cur':''}"></i>`).join('')}</div>`;
const replayBtn=()=>`<button class="speak" data-act="replay">${SPK}再聽一次</button>`;
function mix(list){const idx=shuffle(list.map((_,i)=>i));return {opts:idx.map(i=>list[i]),a:idx.indexOf(0),order:idx};}
const prioritized=(lang,ws)=>shuffle(ws).sort((a,b)=>memRank(lang,a)-memRank(lang,b));   // 要重溫（愈耐愈先）→ 學緊／未學 → 已記住
function orList(caps){return caps.length<2?caps.join(''):caps.slice(0,-1).join('、')+'，定係'+caps[caps.length-1]+'？';}

/* ---- 今日重溫：跨科目，專揀「要重溫」同「學緊但今日未溫」嘅字 ---- */
function reviewCandidates(){
  const seen=new Set(),out=[];
  T.subjects.forEach(s=>s.items.forEach(it=>(it.words||[]).forEach(w=>{
    const k=mkey(s.lang,w);if(seen.has(k))return;seen.add(k);
    const st=memState(s.lang,w),m=store.mem[k];
    if(st==='due'||(st==='learn'&&m.d!==dayKey()))out.push({w,lang:s.lang,pool:it.words,rank:memRank(s.lang,w)});
  })));
  return out.sort((a,b)=>a.rank-b.rank);
}
function startReview(){
  const c=reviewCandidates().slice(0,10);
  if(!c.length){toast('今天沒有要複習的字，好棒！',2000);return;}
  SUBJ=null;LOGVIEW=false;
  G={g:'review',review:true,lang:'yue',earned:0,r:0,key:'review'};
  G.qs=c.map(x=>{
    const m=mix([x.w,...shuffle(x.pool.filter(y=>y!==x.w)).slice(0,2)].map(y=>wv(y,'md',x.lang)));
    return {say:x.w,sayLang:x.lang,lang:x.lang,ask:x.lang==='en'?'聽聽看，是哪一個英文字？':'聽聽看，是哪一個？',...m,wide:true,kw:x.w,pop:PIC[x.w]};
  });
  G.total=G.qs.length;quizRound();
}
function startGame(i,g){
  const it=SUBJ.items[i];
  G={g,it,i,lang:SUBJ.lang,earned:0,r:0,key:dkey(i,g)};
  if(GEN[g]){G.qs=GEN[g](it);G.total=G.qs.length;quizRound();return;}
  ({cards:cardsInit,match:matchInit,lmatch:matchInit,order:orderInit,chant:chantInit,pickall:pickInit})[g]();
}
/* ---- 混合遊戲：每一科只有一個「開始遊戲」，每次抽 4 關（唔同題型混埋，每關幾題），唔使再揀聽音選字／翻牌配對 ---- */
const SEG_Q=3;
function startMix(){
  const s=SUBJ,all=[];
  s.items.forEach((it,i)=>(it.games||[]).filter(g=>!isLearn(g)).forEach(g=>all.push({i,g})));
  if(!all.length)return;
  const cnt=sg=>(store.done[dkey(sg.i,sg.g)]||0)+Math.random();   // 玩得少嘅優先，同次數就隨機
  const segs=shuffle(all.sort((a,b)=>cnt(a)-cnt(b)).slice(0,4));
  G={g:segs[0].g,it:s.items[segs[0].i],i:segs[0].i,lang:s.lang,earned:0,r:0,key:'',mix:{segs,idx:0}};
  runSeg();
}
function runSeg(){
  const sg=G.mix.segs[G.mix.idx],it=SUBJ.items[sg.i];
  Object.assign(G,{g:sg.g,it,i:sg.i,key:dkey(sg.i,sg.g),r:0,lock:false,miss:0,streak:0,qs:null});
  if(GEN[sg.g]){G.qs=GEN[sg.g](it).slice(0,SEG_Q);G.total=G.qs.length;quizRound();return;}
  ({match:matchInit,lmatch:matchInit,order:orderInit,pickall:pickInit})[sg.g]();
}
function finish(){
  if(G.stickerNow){announceThen(finish);return;}   // 最後一題先拎到貼紙：先報完，先出完成畫面
  store.done[G.key]=(store.done[G.key]||0)+1;save();
  if(G.mix&&G.mix.idx<G.mix.segs.length-1){   // 仲有下一關：靜靜哋接落去，唔使慶祝畫面
    const g0=G;G.mix.idx++;chime(true);toast(`第 ${G.mix.idx+1} 關 ▶`,1200);
    setTimeout(()=>{if(G===g0){runSeg();window.scrollTo(0,0);}},900);return;
  }
  chime(true);setTimeout(()=>say('好叻呀仁仁！','yue'),300);
  const fall=Array.from({length:16},()=>`<i class="fall" style="left:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*1.6).toFixed(2)}s;font-size:${18+Math.random()*26|0}px">★</i>`).join('');
  app.insertAdjacentHTML('beforeend',`<div class="cele" role="dialog" aria-label="完成">${fall}
    <div class="cele-box"><div class="big-star">★</div><h2>好棒喔，仁仁！</h2><p>這次得到 <b>${G.earned}</b> 顆星 ★</p>${G.newSticker?'':stickerLeftLine()}${G.capped?'<p class="small">今天的星星已經拿滿了，明天再來！</p>':G.dupe&&!G.earned?'<p class="small">這些題目今天已經拿過星星了，明天再來拿新的！</p>':''}${G.newSticker?`<p class="newstk">新貼紙 <span>${G.newSticker.s}</span> ${G.newSticker.n}</p>`:''}
    <div class="cele-row">${G.review?'<button class="btn" data-act="home">回主頁</button>':`<button class="btn" data-act="again">再玩一次</button><button class="btn ghost" data-act="subj">回到${esc(SUBJ.name)}</button><button class="btn ghost" data-act="home">回主頁</button>`}</div></div></div>`);
}

/* ---- 題目產生器（全部用同一個問答畫面） ---- */
const EMO=[['🍎','蘋果','個','個'],['⭐','星星','粒','顆'],['🐟','魚','條','條'],['🚗','車','架','輛'],['🎈','氣球','個','個'],['🐥','小雞','隻','隻']];   // [圖,名,朗讀量詞,畫面量詞]
const ROUND=['🍪','⚽','🍩','🌕','🍊','🕐'],NOTROUND=['📦','🎁','📕','📺','🧀','📏'];
const GEN={
  hear(it){
    const lang=G.lang,ws=prioritized(lang,it.words).slice(0,Math.min(8,it.words.length));
    return ws.map(w=>{const m=mix([w,...shuffle(it.words.filter(x=>x!==w)).slice(0,2)].map(x=>wv(x,'md',lang)));
      return {say:w,ask:lang==='en'?'聽聽看，是哪一個英文字？':'聽聽看，是哪一個？',...m,wide:true,kw:w,pop:PIC[w]};});
  },
  picword(it){
    const ws=prioritized('en',it.words).slice(0,Math.min(8,it.words.length));
    return ws.map(w=>{const m=mix([w,...shuffle(it.words.filter(x=>x!==w)).slice(0,2)].map(x=>wv(x,'md','en')));
      return {say:'呢個係咩？揀啱個英文字。',sayLang:'yue',prompt:pc(PIC[w]||'？'),ask:'這是什麼？請選出正確的英文字',...m,wide:true,kw:w,ok:()=>say(w,'en'),okWait:1700};});
  },
  sent(it){
    const words=(SUBJ.items.find(x=>x.words)||{words:[]}).words;
    return Array.from({length:6},()=>{
      const t=rand(it.sentences),w=rand(t.opts);
      let others=shuffle(t.opts.filter(o=>o!==w));
      if(others.length<2)others=others.concat(shuffle(words.filter(x=>!t.opts.includes(x))));
      const full=t.pre+w+t.post,m=mix([w,...others.slice(0,2)].map(x=>wv(x,'md',G.lang)));
      return {say:full,prompt:`<div class="sentence"><span>${esc(t.pre)}</span><span class="blank">${PIC[w]||'？'}</span><span>${esc(t.post)}</span></div>`,...m,wide:true,kw:w,
        ok:()=>{const b=app.querySelector('.blank');b.innerHTML=cells(w,'sn');b.classList.add('filled');setTimeout(()=>say(full,G.lang),300);},okWait:2600};
    });
  },
  count(){
    return shuffle([1,2,3,1,2,3]).map((n,k)=>{
      const [e,name,cl,cl2]=rand(EMO);   // cl＝朗讀用量詞（廣東話），cl2＝畫面用量詞（國語）
      if(k%2===0){const m=mix([n,...[1,2,3].filter(x=>x!==n)].map(numv));
        return {say:`有幾多${cl}${name}？`,prompt:grp(e,n),ask:`有幾${cl2}${name}？`,...m,ok:()=>say(QN(n)+cl,'yue'),okWait:1500};}
      const m=mix([n,...[1,2,3].filter(x=>x!==n)].map(x=>grp(e,x)));
      return {say:`邊度有${QN(n)}${cl}${name}？`,prompt:numv(n),ask:`哪一個有 ${n} ${cl2}${name}？`,...m,ok:()=>say(QN(n)+cl,'yue'),okWait:1500};
    });
  },
  next(){
    return Array.from({length:8},()=>{
      const s=1+(Math.random()*28|0),ans=s+2;
      const pool=shuffle([s-1,s+3,s+4,s+5,s+1+10,ans-10].filter(x=>x>=1&&x<=30&&x!==ans&&x!==s&&x!==s+1));
      const m=mix([ans,...pool.slice(0,2)].map(x=>`<span class="numv"><b>${x}</b></span>`));
      return {say:`${s}、${s+1}，跟住係咩？`,prompt:`<div class="seq"><span>${s}</span><span>${s+1}</span><span class="q">?</span></div>`,ask:'接下來是哪一個數字？',...m,ok:()=>say(String(ans),'yue'),okWait:1400};
    });
  },
  color(){
    return Array.from({length:6},()=>{const m=mix(['blue',...shuffle(['red','yellow','green']).slice(0,2)].map(swv));
      return {say:'邊個係藍色？',ask:'哪一個是藍色？',...m,ok:()=>say('係藍色！','yue'),okWait:1400};});
  },
  shape(){
    return Array.from({length:6},(_,k)=>{
      const list=k%2===0?['circle',...shuffle(['square','triangle','star']).slice(0,2)].map(shv)
        :[rand(ROUND),...shuffle(NOTROUND).slice(0,2)].map(e=>pc(e));
      return {say:k%2===0?'邊個係圓形？':'邊樣嘢係圓形？',ask:k%2===0?'哪一個是圓形？':'哪一樣東西是圓形？',...mix(list),ok:()=>say('係圓形！','yue'),okWait:1400};
    });
  },
  letter(it){
    return Array.from({length:8},(_,k)=>{
      const L=rand(it.letters),show=[x=>x+x.toLowerCase(),x=>x,x=>x.toLowerCase()][k%3];
      const m=mix([L,...shuffle(it.letters.filter(x=>x!==L)).slice(0,2)].map(x=>`<span class="en md">${show(x)}</span>`));
      return {say:L,sayLang:'en',ask:'聽聽看，是哪一個字母？',...m};
    });
  },
  sort(it){
    const set=rand(it.sorts),bs=i=>set.bins[i][2]||set.bins[i][1];   // 籃子 [圖, 畫面文字, 朗讀文字?]；物品 [圖, 畫面文字, 籃子, 朗讀文字?]
    return shuffle(set.items).map(([e,name,b,sn])=>({
      say:`${sn||name}，放入${bs(0)}，定係${bs(1)}？`,qid:name+'|'+set.bins[0][1],prompt:pc(e,name),ask:'要放進哪一個籃子？',
      opts:set.bins.map(([be,bn])=>pc(be,bn)),a:b,ok:()=>say(`${sn||name}係${bs(b)}`,'yue'),okWait:1700
    }));
  },
  wetdry(){
    const qs=shuffle(['👕','🧦','🧸','👖','🧢','🐶']).slice(0,4).map(e=>{
      const askWet=Math.random()<.5,m=mix([wetv(e,askWet),wetv(e,!askWet)]);
      return {say:askWet?'邊個係濕嘅？':'邊個係乾嘅？',ask:askWet?'哪一個是濕的？':'哪一個是乾的？',...m};
    });
    [['啱啱沖完涼，頭髮係乾定濕？','剛洗完澡，頭髮是乾的還是濕的？','濕'],['曬咗成日太陽嘅衫，係乾定濕？','曬了一整天太陽的衣服，是乾的還是濕的？','乾'],['落雨冇帶遮，件衫會點？','下雨沒帶傘，衣服會怎麼樣？','濕']].forEach(([q,qd,a])=>{
      const list=a==='濕'?[pc('💧','濕'),pc('☀️','乾')]:[pc('☀️','乾'),pc('💧','濕')];
      qs.push({say:q,ask:qd,...mix(list)});   // say＝朗讀（維持原樣），ask＝畫面文字
    });
    return shuffle(qs).slice(0,6);
  },
  quiz(it){
    return shuffle(it.quiz).map(x=>{
      // 選項 [圖, 畫面文字, 朗讀文字?]；題目 {q:畫面, say:朗讀?}：朗讀內容維持原樣，只改畫面文字
      const m=mix(x.o.map(([e,c])=>pc(e,c))),caps=m.order.map(i=>x.o[i][2]||x.o[i][1]);
      return {say:(x.say||x.q)+'　'+orList(caps),qid:x.q,prompt:x.show?pc(x.show):'',ask:x.q,...m,ok:()=>say(x.o[0][2]||x.o[0][1],'yue'),okWait:1700};
    });
  }
};

function quizRound(){
  const q=G.qs[G.r];G.lock=false;G.miss=0;G.rs=[q.say,q.sayLang||G.lang];
  renderGame(`${dots()}<div class="qcard">${q.prompt||''}${q.ask?`<p class="ask">${esc(q.ask)}</p>`:''}</div>${replayBtn()}
    <div class="choices ${q.wide?'col':'row'}" style="--n:${q.opts.length}">${q.opts.map((o,i)=>`<button class="choice" data-act="pick" data-i="${i}">${o}</button>`).join('')}</div>`);
  say(...G.rs);
}
function pick(b){
  if(G.lock)return;
  const i=+b.dataset.i,q=G.qs[G.r];
  if(i===q.a){
    G.lock=true;b.classList.add('right');award(q.kw,G.miss===0,q.lang,q.qid||'r'+G.r);chime(true);   // 題目編號：內容固定嘅題用 qid／字；隨機產生嘅題用「第幾題」
    G.streak=G.miss===0?(G.streak||0)+1:0;
    if([3,5,8].includes(G.streak))toast(`🔥 連續答對 ${G.streak} 題！`,1800);
    if(q.pop)b.insertAdjacentHTML('beforeend',`<span class="pop">${q.pop}</span>`);
    let wait=1600;
    if(q.ok){q.ok();wait=q.okWait||1800;}else wait=700;   // 答啱只聽樂器提示音，唔逐題讚；完成成份先講「好叻呀」
    afterSpeech(gd(()=>praiseThen(()=>{G.r++;G.r>=G.total?finish():quizRound();})),wait);   // 等答案讀完先跳下一題（唔打斷）
  }else{
    // 答錯一次就跳題：唔俾再撳（否則會一直撳到啱為止）。標出正確答案、讀出嚟，無星星，然後去下一題
    G.lock=true;G.streak=0;
    penalize(q.kw,q.lang||G.lang);
    G.miss++;b.classList.add('wrong');chime(false);
    app.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim');});
    const rb=app.querySelectorAll('.choice')[q.a],g0=G;if(rb){rb.classList.remove('dim');rb.classList.add('reveal');try{rb.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}
    const gb=app.querySelector('.gbody');
    if(gb)gb.insertAdjacentHTML('beforeend','<div class="fb" role="status">👆 正確答案在這裡<b>沒關係，繼續加油喔，仁仁！</b></div>');
    const ans=((rb&&rb.textContent)||'').replace(/[^\p{L}\p{N}]/gu,'');
    setTimeout(()=>{   // 等柔和提示音完咗，先讀出正確答案，再鼓勵
      if(G!==g0)return;
      if(q.ok)q.ok();else if(q.kw)say(q.kw,q.lang||G.lang);else if(q.sayLang)say(q.say,q.sayLang);else if(ans)say(ans,'yue');
      afterSpeech(()=>{
        if(G!==g0)return;
        say('唔緊要，繼續加油仁仁！','yue');
        afterSpeech(()=>{if(G!==g0)return;G.r++;G.r>=G.total?finish():quizRound();},1500);
      },q.okWait||1500);
    },900);
  }
}

/* ---- 字卡 ---- */
function cardsInit(){G.list=SHUF[skey(G.i)]||G.it.words;G.ci=0;renderCards();}
function renderCards(){
  const w=G.list[G.ci],st=memState(G.lang,w),mm=store.mem[mkey(G.lang,w)];
  const k=st==='got'?(mm.b>=3?3:2):st==='new'?0:1;
  renderGame(`
    <div class="fc-count">${G.ci+1} / ${G.list.length}</div>
    <button class="flash" data-act="sayc" aria-label="讀出 ${esc(w)}">${wv(w,'lg',G.lang)}<span class="pic">${PIC[w]||''}</span></button>
    <div class="kstars" aria-label="${MEM_TXT[st]}">${'★'.repeat(k)}<span class="dim">${'★'.repeat(3-k)}</span></div>
    <p class="small" style="text-align:center">${MEM_TXT[st]}</p>
    <div class="nav"><button class="round" data-act="prev" aria-label="上一個">‹</button><button class="round speakr" data-act="sayc" aria-label="再讀一次">${SPK}</button><button class="round" data-act="next" aria-label="下一個">›</button></div>`);
  say(w,G.lang);
  if(G.ci===G.list.length-1&&!store.done[G.key]){store.done[G.key]=1;save();}
}

/* ---- 翻牌配對 ---- */
function matchInit(){
  let pairs;
  if(G.g==='lmatch'){
    pairs=shuffle(G.it.letters).slice(0,2).map(L=>({k:L,a:`<span class="en mm">${L}</span>`,b:`<span class="en mm">${L.toLowerCase()}</span>`,say:L,lang:'en'}));
  }else{
    const used=new Set();pairs=[];
    for(const w of prioritized(G.lang,G.it.words)){const p=PIC[w];if(!p||used.has(p))continue;used.add(p);
      pairs.push({k:w,a:wv(w,'mm',G.lang),b:`<span class="memo">${p}</span>`,say:w,lang:G.lang});if(pairs.length===2)break;}   // 每次只配 2 對（4 張牌），減少干擾
  }
  G.pairs=pairs;G.cards=shuffle(pairs.flatMap(p=>[{k:p.k,side:'a',p},{k:p.k,side:'b',p}]));
  G.first=null;G.lock=false;G.done=0;G.misses=0;
  renderGame(`<p class="small" style="text-align:center">${G.g==='lmatch'?'找出一對：大寫和小寫':'找出一對：字和圖'}</p><div class="mgrid">${G.cards.map((c,i)=>`
    <button class="mcard" data-act="flip" data-i="${i}" aria-label="翻牌"><span class="in"><span class="face back">★</span><span class="face front">${c.p[c.side]}</span></span></button>`).join('')}</div>`);
}
function flip(b){
  const i=+b.dataset.i,c=G.cards[i];
  if(G.lock||c.open||c.done)return;
  c.open=true;b.classList.add('open');
  if(c.side==='a')say(c.p.say,c.p.lang);
  if(G.first===null){G.first=i;return;}
  const j=G.first,a=G.cards[j];G.first=null;
  const bj=app.querySelector(`.mcard[data-i="${j}"]`);
  if(a.k===c.k){
    a.done=c.done=true;b.classList.add('done');bj.classList.add('done');
    award(G.g==='lmatch'?null:c.k,false,G.lang,c.k);chime(true);   // 翻牌看得到答案，只算見過，不計升級
    setTimeout(()=>say(c.p.say,c.p.lang),250);
    if(++G.done===G.pairs.length)setTimeout(finish,1200);
  }else{
    G.lock=true;
    setTimeout(()=>{a.open=c.open=false;b.classList.remove('open');bj.classList.remove('open');G.lock=false;},1000);
  }
}

/* ---- 排次序 ---- */
function orderInit(){G.total=G.mix?2:6;orderRound();}
function orderRound(){
  G.nextN=1;G.miss=0;const useGrp=G.r%2===1,e=rand(EMO)[0];
  G.rs=[useGrp?'由少到多，順序撳':'由一開始，順序撳','yue'];
  renderGame(`${dots()}<div class="qcard"><p class="ask">${useGrp?'由少到多，依序按':'從 1 開始，依序按'}</p></div>${replayBtn()}
    <div class="choices row" style="--n:3">${shuffle([1,2,3]).map(n=>`<button class="choice" data-act="ord" data-n="${n}">${useGrp?grp(e,n):numv(n)}</button>`).join('')}</div>`);
  say(...G.rs);
}
function ord(b){
  const n=+b.dataset.n;
  if(n===G.nextN){
    b.classList.add('right');b.disabled=true;say(CN[n],'yue');G.nextN++;
    if(G.nextN>3){award(null,G.miss===0,G.lang,'r'+G.r);chime(true);afterSpeech(gd(()=>praiseThen(()=>{G.r++;G.r>=G.total?finish():orderRound();})),1300);}
  }else{
    G.miss++;chime(false);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  }
}

/* ---- 唱數 1-30 ---- */
function chantInit(){
  G.tok=0;
  renderGame(`<div class="qcard"><p class="ask">一起從 1 數到 30</p><p class="small">按「一起數」會一個一個唸出來；按任何數字也會唸。</p></div>
    <div class="crow"><button class="btn blue" data-act="chgo">${SPK.replace('width="24"','width="20"')} 一起數</button><button class="btn ghost" data-act="chstop">停</button></div>
    <div class="ngrid">${Array.from({length:30},(_,i)=>`<button class="nb" data-act="cnum" data-n="${i+1}">${i+1}</button>`).join('')}</div>`);
}
function chantStep(n,tok){
  if(G.tok!==tok||G.g!=='chant')return;
  app.querySelectorAll('.nb.lit').forEach(x=>x.classList.remove('lit'));
  if(n>30){award(null,true,G.lang,'chant');finish();return;}
  const b=app.querySelector(`.nb[data-n="${n}"]`);if(b){b.classList.add('lit','seen');}
  let moved=false;const adv=()=>{if(moved)return;moved=true;setTimeout(()=>chantStep(n+1,tok),180);};
  say(String(n),'yue',adv);setTimeout(adv,2600);
}

/* ---- 揀晒藍色 ---- */
const BLUE=['🫐','👖','🐳','📘','🧢','💙','🚙'],NOTBLUE=['🍎','🍌','🍊','🍓','🌽','🐥','🍋','🥕','🌻','🍅'];
function pickInit(){G.total=G.mix?2:4;pickRound();}
function pickRound(){
  G.cells=shuffle([...shuffle(BLUE).slice(0,3).map(e=>({e,b:1})),...shuffle(NOTBLUE).slice(0,3).map(e=>({e,b:0}))]);
  G.found=0;G.miss=0;G.rs=['揀晒所有藍色嘅嘢出嚟','yue'];
  renderGame(`${dots()}<div class="qcard"><p class="ask">請選出所有藍色的東西</p><p class="small">一共有 3 個</p></div>${replayBtn()}
    <div class="pgrid">${G.cells.map((c,i)=>`<button class="choice" data-act="pk" data-i="${i}">${pc(c.e)}</button>`).join('')}</div>`);
  say(...G.rs);
}
function pk(b){
  const c=G.cells[+b.dataset.i];
  if(c.b){
    b.classList.add('right');b.disabled=true;chime(true);
    if(++G.found===3){award(null,G.miss===0,G.lang,'r'+G.r);chime(true);afterSpeech(gd(()=>praiseThen(()=>{G.r++;G.r>=G.total?finish():pickRound();})),1300);}
  }else{
    G.miss++;chime(false);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');say('呢個唔係藍色','yue');
  }
}

/* ============ 導覽：接上瀏覽器歷史，手機滑動返回／返回鍵都返到上一頁（唔會直接離開網站），返回時記得捲動位置 ============ */
let NAV=[{v:'home'}];
try{history.scrollRestoration='manual';}catch(e){}
function navPush(v,extra){
  try{history.replaceState({...(history.state||{}),y:window.scrollY},'');}catch(e){}   // 記低離開時捲到邊
  NAV.push({v,...extra});
  try{history.pushState({v,d:NAV.length-1,...extra},'');}catch(e){}
}
let PENDING_ROOT=null;
function navHome(){if(NAV.length>1)history.go(-(NAV.length-1));else{renderRoot(ROOT);window.scrollTo(0,0);}}
function navBack(){if(NAV.length>1)history.back();else{renderRoot(ROOT);window.scrollTo(0,0);}}
function goTab(t){
  if(t==='review'){
    if(reviewCandidates().length){navPush('game');startReview();window.scrollTo(0,0);}
    else toast('今天沒有要複習的字，好棒！',2000);
    return;
  }
  if(NAV.length>1){PENDING_ROOT=t;history.go(-(NAV.length-1));return;}   // 先退返去最底層，再轉分頁
  ROOT=t;NAV=[{v:t}];try{history.replaceState({v:t,d:0},'');}catch(e){}
  renderRoot(t);window.scrollTo(0,0);
}
function navToSubject(){if(NAV.length>1&&NAV[NAV.length-1].v==='game')history.back();else renderSubject();}
function showView(st){
  G=null;hush();
  const v=(st&&st.v)||'home';
  if(v==='list'&&st.id){SUBJ=T.subjects.find(s=>s.id===st.id)||SUBJ;if(SUBJ&&SUBJ.items[st.i]){LISTI=st.i;renderList();return;}}
  if((v==='subj'||v==='game')&&st.id){SUBJ=T.subjects.find(s=>s.id===st.id)||SUBJ;if(SUBJ){renderSubject();return;}}
  if(v==='log'){renderUsageLog();return;}
  if(ROOTS.includes(v))ROOT=v;
  renderRoot(ROOT);
}
window.addEventListener('popstate',e=>{
  if(!T)return;
  const st=e.state||{v:'home',d:0};
  if(PENDING_ROOT){const t=PENDING_ROOT;PENDING_ROOT=null;ROOT=t;NAV=[{v:t}];try{history.replaceState({v:t,d:0},'');}catch(err){}renderRoot(t);window.scrollTo(0,0);return;}
  NAV.length=(st.d||0)+1;NAV[NAV.length-1]={v:st.v,id:st.id};
  showView(st);
  setTimeout(()=>window.scrollTo(0,st.y||0),0);
});
const gd=fn=>{const g0=G;return()=>{if(G===g0)fn();};};   // 離開咗遊戲就唔好再執行佢嘅延遲動作

/* ============ 撳掣 ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  switch(a){
    case 'open':SUBJ=T.subjects.find(s=>s.id===b.dataset.id);navPush('subj',{id:SUBJ.id});renderSubject();window.scrollTo(0,0);break;
    case 'home':navHome();break;
    case 'back':navBack();break;
    case 'list':LISTI=+b.dataset.i;navPush('list',{id:SUBJ.id,i:LISTI});renderList();window.scrollTo(0,0);break;
    case 'tab':goTab(b.dataset.t);break;
    case 'usagelog':navPush('log');renderUsageLog();window.scrollTo(0,0);break;
    case 'review':if(reviewCandidates().length)navPush('game');startReview();window.scrollTo(0,0);break;
    case 'subj':navToSubject();break;
    case 'pv':{say(b.dataset.t,b.dataset.l);app.querySelectorAll('.pv.on,.pvs.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');clearTimeout(pvT);pvT=setTimeout(()=>b.classList.remove('on'),1400);break;}   // 撳咗邊個，邊個亮起（讀緊）

    case 'shuf':{const i=+b.dataset.i,it=SUBJ.items[i],src=it.words||it.letters;let s;do{s=shuffle(src);}while(src.length>2&&s.join()===(SHUF[skey(i)]||src).join());SHUF[skey(i)]=s;renderList();chime(true);break;}
    case 'unshuf':delete SHUF[skey(+b.dataset.i)];renderList();break;
    case 'sing':{const k=`${T.id}:${b.dataset.n}`;store.sung[k]=!store.sung[k];save();b.setAttribute('aria-pressed',!!store.sung[k]);if(store.sung[k])chime(true);break;}
    case 'play':navPush('game',{id:SUBJ.id});startGame(+b.dataset.i,b.dataset.g);window.scrollTo(0,0);break;
    case 'again':if(G.mix)startMix();else startGame(G.i,G.g);break;
    case 'mix':navPush('game',{id:SUBJ.id});startMix();window.scrollTo(0,0);break;
    case 'replay':say(...G.rs);break;
    case 'pick':pick(b);break;
    case 'flip':flip(b);break;
    case 'ord':ord(b);break;
    case 'pk':pk(b);break;
    case 'sayc':say(G.list[G.ci],G.lang);break;
    case 'prev':case 'next':{const n=G.list.length;G.ci=(G.ci+(a==='next'?1:-1)+n)%n;renderCards();break;}
    case 'chgo':G.tok++;chantStep(1,G.tok);break;
    case 'chstop':G.tok++;hush();app.querySelectorAll('.nb.lit').forEach(x=>x.classList.remove('lit'));break;
    case 'cnum':G.tok++;say(b.dataset.n,'yue');b.classList.add('seen');break;
    case 'timer':setTimer(!timerOn);break;
    case 'test':{   // 依次試：答啱提示音 → 答錯提示音 → 讀音
      spoke=false;ttsErr='';sndErr='';chime(true);
      setTimeout(()=>chime(false),700);
      setTimeout(()=>say('你好，仁仁','yue'),1600);
      const m=document.getElementById('sndMsg');m.parentElement.hidden=false;try{localStorage.setItem('renren-zi-snd-tested','1');}catch(e){}
      m.textContent='測試中：答對的叮叮聲 → 答錯的輕柔提示音 → 說話……';setTimeout(()=>{m.textContent=diag();},3600);break;}
  }
});

/* ============ 載入資料 ============ */
async function boot(){
  try{
    const list=await (await fetch('data/terms.json',{cache:'no-cache'})).json();
    TERMS=await Promise.all(list.map(f=>fetch('data/'+f,{cache:'no-cache'}).then(r=>r.json())));
    TERMS.forEach(t=>{resolveIcons(t);Object.assign(PIC,t.pics||{});});
    T=TERMS[TERMS.length-1];
    renderHome();
    try{history.replaceState({v:'home',d:0},'');}catch(e){}
    if(PREVIEW){const b=document.createElement('div');b.className='pvbadge';b.textContent='預覽模式・不會改動真實進度';document.body.appendChild(b);}
    syncNow();
    checkUpdate();
  }catch(e){
    app.innerHTML='<p class="note">讀取不到複習內容，請檢查網路後重新整理頁面。</p>';
  }
}
loadVoices();
try{speechSynthesis.addEventListener('voiceschanged',()=>{loadVoices();if(T&&!SUBJ&&!G&&!LOGVIEW)renderRoot();});}catch(e){}
boot();
</script>
